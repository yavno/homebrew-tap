name: Audit

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  audit:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-tap-syntax

      - run: brew audit --cask --online --strict yavno/tap/speechtext

      - run: brew livecheck --cask yavno/tap/speechtext
