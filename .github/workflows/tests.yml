name: Audit

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  audit:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-tap-syntax

      - run: brew audit --cask --online --strict yavno/tap/speechtext

      - run: brew livecheck --cask yavno/tap/speechtext
